<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Muzikos laimės ratas</title>
  <style>
    :root {
      --primary: #7c3aed;
      --primary-hover: #6d28d9;
      --gold-main: #f59e0b;
      --gold-light: #fef08a;
      --bg-gradient: linear-gradient(135deg, #f3e8ff 0%, #e0e7ff 50%, #fce7f3 100%);
      --card-bg: rgba(255, 255, 255, 0.95);
      --text-main: #1e1b4b;
      --border-color: #cbd5e1;
      --radius: 20px;
      --shadow: 0 12px 30px -5px rgba(124, 58, 237, 0.15), 0 4px 12px -2px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      padding: 16px 10px;
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Piano Header Banner */
    header {
      position: relative;
      background: linear-gradient(135deg, #7c3aed, #9333ea);
      color: white;
      padding: 24px 20px 36px 20px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      text-align: center;
      overflow: hidden;
    }

    header h1 {
      font-size: 1.9rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    }

    header p {
      font-size: 0.95rem;
      opacity: 0.95;
      margin-top: 4px;
    }

    .piano-keys {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 16px;
      background: repeating-linear-gradient(
        90deg,
        #ffffff 0px,
        #ffffff 12px,
        #1e1b4b 12px,
        #1e1b4b 18px,
        #ffffff 18px,
        #ffffff 30px
      );
      border-top: 2px solid #1e1b4b;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    @media (min-width: 850px) {
      .main-grid {
        grid-template-columns: 480px 1fr;
      }
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      border: 2px solid #ffffff;
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .wheel-section {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .participant-box {
      width: 100%;
      margin-bottom: 12px;
    }

    label {
      font-size: 0.9rem;
      font-weight: 700;
      color: #475569;
      display: block;
      margin-bottom: 6px;
    }

    input[type="text"], input[type="number"], select {
      width: 100%;
      padding: 11px 14px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 0.95rem;
      outline: none;
      background: white;
      transition: all 0.2s;
    }

    input[type="text"]:focus, input[type="number"]:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15);
    }

    /* Wheel Canvas & Arrow Pointer */
    .wheel-wrapper {
      position: relative;
      width: 380px;
      height: 380px;
      max-width: 88vw;
      max-height: 88vw;
      margin: 15px auto 25px auto;
    }

    canvas#wheelCanvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
    }

    .pointer-svg {
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      width: 36px;
      height: 44px;
      z-index: 25;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
    }

    /* Buttons */
    .btn {
      background: linear-gradient(135deg, #7c3aed, #6d28d9);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.25);
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(124, 58, 237, 0.35);
    }

    .btn:active {
      transform: translateY(0);
    }

      width: 100%;
      padding: 16px;
      font-size
  <script>
    // Initial Bright Musical Default Slices
    let slots = [
      { text: "Gama A-dur", weight: 20, color: "#38bdf8" },
      { text: "Pjesė Mintinai", weight: 20, color: "#a855f7" },
      { text: "Saldus Prizas", weight: 10, color: "#f43f5e" },
      { text: "Ritmo Pratimas", weight: 25, color: "#4ade80" },
      { text: "Skaitymas iš natų", weight: 25, color: "#fbbf24" }
    ];

    let currentAngle = 0;
    let isSpinning = false;
    let audioCtx = null;

    // Web Audio Synthesizer
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playTickSound() {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(620, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(180, audioCtx.currentTime + 0.04);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.04);
      } catch(e) {}
    }

    function playWinSound() {
      if (!audioCtx) return;
      try {
        const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6 Fanfare
        notes.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.1);
          gain.gain.setValueAtTime(0.25, audioCtx.currentTime + idx * 0.1);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.1 + 0.45);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(audioCtx.currentTime + idx * 0.1);
          osc.stop(audioCtx.currentTime + idx * 0.1 + 0.45);
        });
      } catch(e) {}
    }

    // Canvas Wheel Drawing with Gold Border & Icons
    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');

    function getTotalWeight() {
      return slots.reduce((sum, s) => sum + (parseFloat(s.weight) || 0), 0);
    }

    function drawWheel() {
      const totalWeight = getTotalWeight();
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const outerRadius = canvas.width / 2 - 4;
      const wheelRadius = outerRadius - 22; // Inner space for golden frame

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (totalWeight <= 0) return;

      // 1. Gold Frame Outer Ring
      ctx.save();
      ctx.beginPath();
      ctx.arc(centerX, centerY, outerRadius, 0, 2 * Math.PI);
      const outerGrad = ctx.createRadialGradient(centerX, centerY, wheelRadius, centerX, centerY, outerRadius);
      outerGrad.addColorStop(0, '#fef08a');
      outerGrad.addColorStop(0.5, '#f59e0b');
      outerGrad.addColorStop(1, '#b45309');
      ctx.fillStyle = outerGrad;
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#78350f';
      ctx.stroke();

      // Golden rivets / bulbs around outer ring
      const numStuds = 20;
      for (let i = 0; i < numStuds; i++) {
        const studAngle = (i * 2 * Math.PI) / numStuds;
        const studX = centerX + (outerRadius - 11) * Math.cos(studAngle);
        const studY = centerY + (outerRadius - 11) * Math.sin(studAngle);
        ctx.beginPath();
        ctx.arc(studX, studY, 4.5, 0, 2 * Math.PI);
        ctx.fillStyle = (i % 2 === 0) ? '#ffffff' : '#fde047';
        ctx.fill();
        ctx.strokeStyle = '#92400e';
        ctx.lineWidth = 1;
        ctx.stroke();
      }
      ctx.restore();

      // 2. Wheel Slices with Musical Icons
      let startAngle = currentAngle;
      const musicalIcons = ['🎵', '🎹', '🎶', '🎼', '⭐', '🎺', '🎸', '🔔'];

      slots.forEach((slot, index) => {
        const sliceAngle = ((parseFloat(slot.weight) || 0) / totalWeight) * 2 * Math.PI;

        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, wheelRadius, startAngle, startAngle + sliceAngle);
        ctx.closePath();

        ctx.fillStyle = slot.color;
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();

        // Text & Icons
        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.rotate(startAngle + sliceAngle / 2);
        ctx.textAlign = "right";
        ctx.fillStyle = "#1e1b4b";
        ctx.font = "bold 15px 'Segoe UI', sans-serif";
        
        const icon = musicalIcons[index % musicalIcons.length];
        ctx.fillText(`${icon} ${slot.text}`, wheelRadius - 14, 5);
        ctx.restore();

        startAngle += sliceAngle;
      });

      // 3. Center Gold Hub with Music Note
      ctx.save();
      ctx.beginPath();
      ctx.arc(centerX, centerY, 32, 0, 2 * Math.PI);
      const hubGrad = ctx.createRadialGradient(centerX, centerY, 5, centerX, centerY, 32);
      hubGrad.addColorStop(0, '#ffffff');
      hubGrad.addColorStop(0.7, '#fef08a');
      hubGrad.addColorStop(1, '#f59e0b');
      ctx.fillStyle = hubGrad;
      ctx.fill();
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#7c3aed';
      ctx.stroke();

      ctx.fillStyle = '#6d28d9';
      ctx.font = 'bold 22px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🎼', centerX, centerY + 1);
      ctx.restore();
    }

    // Spin Logic
    document.getElementById('spinBtn').addEventListener('click', () => {
      initAudio();
      if (isSpinning) return;
      const totalWeight = getTotalWeight();
      if (totalWeight <= 0) return;

      isSpinning = true;

      let rand = Math.random() * totalWeight;
      let winningIndex = 0;
      let accumulated = 0;

      for (let i = 0; i < slots.length; i++) {
        accumulated += (parseFloat(slots[i].weight) || 0);
        if (rand <= accumulated) {
          winningIndex = i;
          break;
        }
      }

      let currentAcc = 0;
      for (let i = 0; i < winningIndex; i++) {
        currentAcc += (parseFloat(slots[i].weight) || 0);
      }
      const winSlotWeight = parseFloat(slots[winningIndex].weight) || 0;
      const winMiddleFraction = (currentAcc + winSlotWeight / 2) / totalWeight;
      const winTargetAngleOnCircle = winMiddleFraction * 2 * Math.PI;

      const pointerAngle = 1.5 * Math.PI;
      let targetFinalAngle = pointerAngle - winTargetAngleOnCircle;

      const fullRotations = (5 + Math.floor(Math.random() * 3)) * 2 * Math.PI;
      const startAngleState = currentAngle % (2 * Math.PI);
      const totalDelta = fullRotations + (targetFinalAngle - startAngleState);

      const duration = 4500;
      const startTime = performance.now();
      let lastAudioAngle = startAngleState;

      function animateSpin(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);
        
        const easeOut = 1 - Math.pow(1 - progress, 5);
        currentAngle = startAngleState + totalDelta * easeOut;

        const sliceStep = (2 * Math.PI) / (slots.length || 1);
        if (Math.abs(currentAngle - lastAudioAngle) > sliceStep * 0.7) {
          playTickSound();
          lastAudioAngle = currentAngle;
        }

        drawWheel();

        if (progress < 1) {
          requestAnimationFrame(animateSpin);
        } else {
          isSpinning = false;
          playWinSound();
          triggerConfetti();
          
          const wonText = slots[winningIndex].text;
          const studentName = document.getElementById('participantName').value.trim() || 'Mokinys';
          
          showWinModal(studentName, wonText);
          addHistoryItem(studentName, wonText);
        }
      }

      requestAnimationFrame(animateSpin);
    });

    // UI Slot Control Functions
    function renderSlotsUI() {
      const container = document.getElementById('slotsContainer');
      container.innerHTML = '';
      const total = getTotalWeight();

      slots.forEach((slot, index) => {
        const row = document.createElement('div');
        row.className = 'slot-row';
        row.innerHTML = `
          <input type="text" value="${slot.text}" oninput="updateSlot(${index}, 'text', this.value)">
          <input type="number" min="1" value="${slot.weight}" oninput="updateSlot(${index}, 'weight', this.value)">
          <input type="color" class="color-picker" value="${slot.color}" onchange="updateSlot(${index}, 'color', this.value)">
          <button class="btn btn-sm btn-danger" onclick="removeSlot(${index})">✕</button>
        `;
        container.appendChild(row);
      });

      document.getElementById('totalProbLabel').innerText = `Bendra svorių suma: ${total}`;
      drawWheel();
    }

    function updateSlot(index, field, value) {
      slots[index][field] = field === 'weight' ? parseFloat(value) || 0 : value;
      renderSlotsUI();
    }

    function addSlot() {
      const colors = ["#f43f5e", "#38bdf8", "#fbbf24", "#4ade80", "#a855f7", "#fb7185"];
      slots.push({ text: `Užduotis ${slots.length + 1}`, weight: 10, color: colors[slots.length % colors.length] });
      renderSlotsUI();
    }

    function removeSlot(index) {
      if (slots.length <= 2) {
        alert("Ratas privalo turėti bent 2 sektorius!");
        return;
      }
      slots.splice(index, 1);
      renderSlotsUI();
    }

    // Templates
    function saveTemplate() {
      const name = document.getElementById('templateNameInput').value.trim();
      if (!name) { alert("Įveskite šablono pavadinimą!"); return; }
      const templates = JSON.parse(localStorage.getItem('wheelTemplates') || '{}');
      templates[name] = slots;
      localStorage.setItem('wheelTemplates', JSON.stringify(templates));
      document.getElementById('templateNameInput').value = '';
      updateTemplateDropdown();
      alert(`Šablonas "${name}" išsaugotas!`);
    }

    function updateTemplateDropdown() {
      const select = document.getElementById('templateSelect');
      select.innerHTML = '<option value="">-- Pasirinkite šabloną --</option>';
      const templates = JSON.parse(localStorage.getItem('wheelTemplates') || '{}');
      Object.keys(templates).forEach(name => {
        const opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        select.appendChild(opt);
      });
    }

    function loadTemplate() {
      const name = document.getElementById('templateSelect').value;
      if (!name) return;
      const templates = JSON.parse(localStorage.getItem('wheelTemplates') || '{}');
      if (templates[name]) {
        slots = JSON.parse(JSON.stringify(templates[name]));
        renderSlotsUI();
      }
    }

    function deleteTemplate() {
      const name = document.getElementById('templateSelect').value;
      if (!name) return;
      const templates = JSON.parse(localStorage.getItem('wheelTemplates') || '{}');
      delete templates[name];
      localStorage.setItem('wheelTemplates', JSON.stringify(templates));
      updateTemplateDropdown();
    }

    // History
    function addHistoryItem(name, prize) {
      const history = JSON.parse(localStorage.getItem('wheelHistory') || '[]');
      const dateStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      history.unshift({ name, prize, time: dateStr });
      localStorage.setItem('wheelHistory', JSON.stringify(history));
      renderHistoryUI();
    }

    function renderHistoryUI() {
      const history = JSON.parse(localStorage.getItem('wheelHistory') || '[]');
      const list = document.getElementById('historyList');
      list.innerHTML = '';
      history.forEach(item => {
        const li = document.createElement('li');
        li.className = 'history-item';
        li.innerHTML = `<span><span class="history-name">${item.name}</span>: ${item.prize}</span><span style="color:#94a3b8; font-size:0.8rem;">${item.time}</span>`;
        list.appendChild(li);
      });
    }

    function clearHistory() {
      localStorage.removeItem('wheelHistory');
      renderHistoryUI();
    }

    // Win Modal
    function showWinModal(name, text) {
      document.getElementById('winText').innerText = `${name} laimėjo: "${text}"!`;
      document.getElementById('winModal').classList.add('active');
    }

    function closeWinModal() {
      document.getElementById('winModal').classList.remove('active');
    }

    // Confetti Effect
    const confettiCanvas = document.getElementById('confettiCanvas');
    const confettiCtx = confettiCanvas.getContext('2d');
    let particles = [];

    function resizeConfetti() {
      confettiCanvas.width = window.innerWidth;
      confettiCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeConfetti);
    resizeConfetti();

    function triggerConfetti() {
      particles = [];
      const colors = ['#f59e0b', '#ef4444', '#a855f7', '#38bdf8', '#4ade80', '#fbbf24'];
      for (let i = 0; i < 90; i++) {
        particles.push({
          x: window.innerWidth / 2,
          y: window.innerHeight / 2,
          vx: (Math.random() - 0.5) * 14,
          vy: (Math.random() - 0.7) * 14,
          size: Math.random() * 8 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          life: 100
        });
      }
      animateConfetti();
    }

    function animateConfetti() {
      confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      particles.forEach((p, index) => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.25;
        p.life -= 1.5;
        confettiCtx.fillStyle = p.color;
        confettiCtx.fillRect(p.x, p.y, p.size, p.size);
        if (p.life <= 0) particles.splice(index, 1);
      });

      if (particles.length > 0) {
        requestAnimationFrame(animateConfetti);
      }
    }

    // Init App
    renderSlotsUI();
    updateTemplateDropdown();
    renderHistoryUI();
  </script>
</body>
</html>
