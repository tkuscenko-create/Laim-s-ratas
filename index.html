<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Muzikos laimės ratas</title>
  <style>
    :root {
      --primary: #7c3aed;
      --primary-hover: #6d28d9;
      --gold-main: #f59e0b;
      --gold-light: #fef08a;
      --bg-gradient: linear-gradient(135deg, #f3e8ff 0%, #e0e7ff 50%, #fce7f3 100%);
      --card-bg: rgba(255, 255, 255, 0.95);
      --text-main: #1e1b4b;
      --border-color: #cbd5e1;
      --radius: 20px;
      --shadow: 0 12px 30px -5px rgba(124, 58, 237, 0.15), 0 4px 12px -2px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      padding: 16px 10px;
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      position: relative;
      background: linear-gradient(135deg, #7c3aed, #9333ea);
      color: white;
      padding: 24px 20px 36px 20px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      text-align: center;
      overflow: hidden;
    }

    header h1 {
      font-size: 1.9rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    }

    header p {
      font-size: 0.95rem;
      opacity: 0.95;
      margin-top: 4px;
    }

    .piano-keys {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 16px;
      background: repeating-linear-gradient(
        90deg,
        #ffffff 0px,
        #ffffff 12px,
        #1e1b4b 12px,
        #1e1b4b 18px,
        #ffffff 18px,
        #ffffff 30px
      );
      border-top: 2px solid #1e1b4b;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    @media (min-width: 850px) {
      .main-grid {
        grid-template-columns: 480px 1fr;
      }
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      border: 2px solid #ffffff;
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .wheel-section {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .participant-box {
      width: 100%;
      margin-bottom: 12px;
    }

    label {
      font-size: 0.9rem;
      font-weight: 700;
      color: #475569;
      display: block;
      margin-bottom: 6px;
    }

    input[type="text"], input[type="number"], select {
      width: 100%;
      padding: 11px 14px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 0.95rem;
      outline: none;
      background: white;
      transition: all 0.2s;
    }

    input[type="text"]:focus, input[type="number"]:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15);
    }

    .wheel-wrapper {
      position: relative;
      width: 380px;
      height: 380px;
      max-width: 88vw;
      max-height: 88vw;
      margin: 15px auto 25px auto;
    }

    canvas#wheelCanvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
    }

    .pointer-svg {
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      width: 36px;
      height: 44px;
      z-index: 25;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
    }

    .btn {
      background: linear-gradient(135deg, #7c3aed, #6d28d9);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.25);
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(124, 58, 237, 0.35);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-spin {
      width: 100%;
      padding: 16px;
      font-size: 1.2rem;
      border-radius: 16px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4);
      letter-spacing: 0.5px;
    }

    .btn-spin:hover {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      box-shadow: 0 8px 25px rgba(245, 158, 11, 0.5);
    }

    .btn-sm {
      padding: 7px 12px;
      font-size: 0.85rem;
      border-radius: 8px;
    }

    .btn-danger {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      box-shadow: 0 3px 8px rgba(239, 68, 68, 0.25);
    }

    .btn-success {
      background: linear-gradient(135deg, #10b981, #059669);
      box-shadow: 0 3px 8px rgba(16, 185, 129, 0.25);
    }

    .slot-row {
      display: grid;
      grid-template-columns: 1fr 65px 45px 36px;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px;
    }

    .color-picker {
      height: 40px;
      width: 100%;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      cursor: pointer;
      padding: 2px;
      background: white;
    }

    .template-controls, .history-controls {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .history-list {
      max-height: 200px;
      overflow-y: auto;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      padding: 8px;
      background: white;
      list-style: none;
    }

    .history-item {
      padding: 9px 12px;
      border-bottom: 1px solid #f1f5f9;
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
    }

    .history-item:last-child {
      border-bottom: none;
    }

    .history-name {
      font-weight: 700;
      color: var(--primary);
    }

    canvas#confettiCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 100;
    }

    .win-modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      background: white;
      padding: 32px 24px;
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
      text-align: center;
      z-index: 101;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      width: 90%;
      max-width: 360px;
      border: 4px solid var(--gold-main);
    }

    .win-modal.active {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, -50%) scale(1);
    }

    .win-modal h2 {
      color: var(--primary);
      font-size: 1.6rem;
      margin-bottom: 8px;
    }

    .win-modal p {
      font-size: 1.25rem;
      font-weight: 800;
      color: #d97706;
      margin: 14px 0 22px 0;
      line-height: 1.4;
    }

    .total-prob {
      font-size: 0.85rem;
      font-weight: 600;
      color: #64748b;
      margin-top: 6px;
      text-align: right;
    }
  </style>
</head>
<body>
  <canvas id="confettiCanvas"></canvas>

  <div class="win-modal" id="winModal">
    <h2>🎉 Valio! Laimėjimas!</h2>
    <p id="winText">-</p>
    <button class="btn btn-spin" style="padding: 10px 24px; font-size: 1rem;" onclick="closeWinModal()">Šaunu!</button>
  </div>

  <div class="app-container">
    <header>
      <h1>🎹 Muzikos Laimės Ratas 🎶</h1>
      <p>Fortepijono pamokų motyvaciniai uždaviniai ir prizai</p>
      <div class="piano-keys"></div>
    </header>

    <div class="main-grid">
      <div class="card wheel-section">
        <div class="participant-box">
          <label for="participantName">👤 Mokinio vardas:</label>
          <input type="text" id="participantName" placeholder="Įveskite mokinio vardą...">
        </div>

        <div class="wheel-wrapper">
          <svg class="pointer-svg" viewBox="0 0 36 44">
            <path d="M 18 44 L 2 8 C 0 4 4 0 8 0 L 28 0 C 32 0 36 4 34 8 Z" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
            <circle cx="18" cy="12" r="5" fill="#fef08a"/>
          </svg>
          <canvas id="wheelCanvas" width="440" height="440"></canvas>
        </div>

        <button class="btn btn-spin" id="spinBtn">🎵 SUKTI RATĄ!</button>
      </div>

      <div style="display: flex; flex-direction: column; gap: 20px;">
        <div class="card">
          <div class="card-title">⚙️ Rato sektoriai ir tikimybės</div>
          <div id="slotsContainer"></div>
          <div class="total-prob" id="totalProbLabel">Bendra svorių suma: 100</div>
          <button class="btn btn-sm btn-success" style="margin-top: 10px;" onclick="addSlot()">+ Pridėti sektorių</button>
        </div>

        <div class="card">
          <div class="card-title">💾 Rato šablonai</div>
          <div class="template-controls">
            <input type="text" id="templateNameInput" placeholder="Šablono pavadinimas...">
            <button class="btn btn-sm" onclick="saveTemplate()">Išsaugoti</button>
          </div>
          <div style="display: flex; gap: 8px; align-items: center;">
            <select id="templateSelect"><option value="">-- Pasirinkite šabloną --</option></select>
            <button class="btn btn-sm" onclick="loadTemplate()">Užkrauti</button>
            <button class="btn btn-sm btn-danger" onclick="deleteTemplate()">Ištrinti</button>
          </div>
        </div>

        <div class="card">
          <div class="card-title">📜 Laimėjimų istorija</div>
          <ul class="history-list" id="historyList"></ul>
          <button class="btn btn-sm btn-danger" style="margin-top: 10px;" onclick="clearHistory()">Išvalyti istoriją</button>
        </div>
      </div>
    </div>
  </div>
  <script>
    let slots = [
      { text: "Gama A-dur", weight: 20, color: "#38bdf8" },
      { text: "Pjesė Mintinai", weight: 20, color: "#a855f7" },
      { text: "Saldus Prizas", weight: 10, color: "#f43f5e" },
      { text: "Ritmo Pratimas", weight: 25, color: "#4ade80" },
      { text: "Skaitymas iš natų", weight: 25, color: "#fbbf24" }
    ];

    let currentAngle = 0;
    let isSpinning = false;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playTickSound() {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(620, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(180, audioCtx.currentTime + 0.04);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.04);
      } catch(e) {}
    }

    function playWinSound() {
      if (!audioCtx) return;
      try {
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.1);
          gain.gain.setValueAtTime(0.25, audioCtx.currentTime + idx * 0.1);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.1 + 0.45);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(audioCtx.currentTime + idx * 0.1);
          osc.stop(audioCtx.currentTime + idx * 0.1 + 0.45);
        });
      } catch(e) {}
    }

    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');

    function getTotalWeight() {
      return slots.reduce((sum, s) => sum + (parseFloat(s.weight) || 0), 0);
    }

    function drawWheel() {
      const totalWeight = getTotalWeight();
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const outerRadius = canvas.width / 2 - 4;
      const wheelRadius = outerRadius - 22;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (totalWeight <= 0) return;

      ctx.save();
      ctx.beginPath();
      ctx.arc(centerX, centerY, outerRadius, 0, 2 * Math.PI);
      const outerGrad = ctx.createRadialGradient(centerX, centerY, wheelRadius, centerX, centerY, outerRadius);
      outerGrad.addColorStop(0, '#fef08a');
      outerGrad.addColorStop(0.5, '#f59e0b');
      outerGrad.addColorStop(1, '#b45309');
      ctx.fillStyle = outerGrad;
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#78350f';
      ctx.stroke();

      const numStuds = 20;
      for (let i = 0; i < numStuds; i++) {
        const studAngle = (i * 2 * Math.PI) / numStuds;
        const studX = centerX + (outerRadius - 11) * Math.cos(studAngle);
        const studY = centerY + (outerRadius - 11) * Math.sin(studAngle);
        ctx.beginPath();
        ctx.arc(studX, studY, 4.5, 0, 2 * Math.PI);
        ctx.fillStyle = (i % 2 === 0) ? '#ffffff' : '#fde047';
        ctx.fill();
        ctx.strokeStyle = '#92400e';
        ctx.lineWidth = 1;
        ctx.stroke();
      }
      ctx.restore();

      let startAngle = currentAngle;
      const musicalIcons = ['🎵', '🎹', '🎶', '🎼', '⭐', '🎺', '🎸', '🔔'];

      slots.forEach((slot, index) => {
        const sliceAngle = ((parseFloat(slot.weight) || 0) / totalWeight) * 2 * Math.PI;

        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, wheelRadius, startAngle, startAngle + sliceAngle);
        ctx.closePath();

        ctx.fillStyle = slot.color;
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();

        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.rotate(startAngle + sliceAngle / 2);
        ctx.textAlign = "right";
        ctx.fillStyle = "#1e1b4b";
        ctx.font = "bold 15px 'Segoe UI', sans-serif";
        
        const icon = musicalIcons[index % musicalIcons.length];
        ctx.fillText(`${icon} ${slot.text}`, wheelRadius - 14, 5);
        ctx.restore();

        startAngle += sliceAngle;
      });

      ctx.save();
      ctx.beginPath();
      ctx.arc(centerX, centerY, 32, 0, 2 * Math.PI);
      const hubGrad = ctx.createRadialGradient(centerX, centerY, 5, centerX, centerY, 32);
      hubGrad.addColorStop(0, '#ffffff');
      hubGrad.addColorStop(0.7, '#fef08a');
      hubGrad.addColorStop(1, '#b45309');
      ctx.fillStyle = hubGrad;
      ctx.fill();
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#7c3aed';
      ctx.stroke();

      ctx.fillStyle = '#6d28d9';
      ctx.font = 'bold 22px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🎼', centerX, centerY + 1);
      ctx.restore();
    }

    document.getElementById('spinBtn').addEventListener('click', () => {
      initAudio();
      if (isSpinning) return;
      const totalWeight = getTotalWeight();
      if (totalWeight <= 0) return;

      isSpinning = true;

      let rand = Math.random() * totalWeight;
      let winningIndex = 0;
      let accumulated = 0;

      for (let i = 0; i < slots.length; i++) {
        accumulated += (parseFloat(slots[i].weight) || 0);
        if (rand <= accumulated) {
          winningIndex = i;
          break;
        }
      }

      let currentAcc = 0;
      for (let i = 0; i < winningIndex; i++) {
        currentAcc += (parseFloat(slots[i].weight) || 0);
      }
      const winSlotWeight = parseFloat(slots[winningIndex].weight) || 0;
      const winMiddleFraction = (currentAcc + winSlotWeight / 2) / totalWeight;
      const winTargetAngleOnCircle = winMiddleFraction * 2 * Math.PI;

      const pointerAngle = 1.5 * Math.PI;
      let targetFinalAngle = pointerAngle - winTargetAngleOnCircle;

      const fullRotations = (5 + Math.floor(Math.random() * 3)) * 2 * Math.PI;
      const startAngleState = currentAngle % (2 * Math.PI);
      const totalDelta = fullRotations + (targetFinalAngle - startAngleState);

      const duration = 4500;
      const startTime = performance.now();
      let lastAudioAngle = startAngleState;

      function animateSpin(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);
        
        const easeOut = 1 - Math.pow(1 - progress, 5);
        currentAngle = startAngleState + totalDelta * easeOut;

        const sliceStep = (2 * Math.PI) / (slots.length || 1);
        if (Math.abs(currentAngle - lastAudioAngle) > sliceStep * 0.7) {
          playTickSound();
          lastAudioAngle = currentAngle;
        }

        drawWheel();

        if (progress < 1) {
          requestAnimationFrame(animateSpin);
        } else {
          isSpinning = false;
          playWinSound();
          triggerConfetti();
          
          const wonText = slots[winningIndex].text;
          const studentName = document.getElementById('participantName').value.trim() || 'Mokinys';
          
          showWinModal(studentName, wonText);
          addHistoryItem(studentName, wonText);
        }
      }

      requestAnimationFrame(animateSpin);
    });

    function renderSlotsUI() {
      const container = document.getElementById('slotsContainer');
      container.innerHTML = '';

      slots.forEach((slot, index) => {
        const row = document.createElement('div');
        row.className = 'slot-row';
        row.innerHTML = `
          <input type="text" value="${slot.text}" oninput="updateSlot(${index}, 'text', this.value)">
          <input type="number" min="1" value="${slot.weight}" oninput="updateSlot(${index}, 'weight', this.value)">
          <input type="color" class="color-picker" value="${slot.color}" onchange="updateSlot(${index}, 'color', this.value)">
          <button class="btn btn-sm btn-danger" onclick="removeSlot(${index})">✕</button>
        `;
        container.appendChild(row);
      });

      document.getElementById('totalProbLabel').innerText = `Bendra svorių suma: ${getTotalWeight()}`;
      drawWheel();
    }

    function updateSlot(index, field, value) {
      slots[index][field] = field === 'weight' ? parseFloat(value) || 0 : value;
      document.getElementById('totalProbLabel').innerText = `Bendra svorių suma: ${getTotalWeight()}`;
      drawWheel();
    }

    function addSlot() {
      const colors = ["#f43f5e", "#38bdf8", "#fbbf24", "#4ade80", "#a855f7", "#fb7185"];
      slots.push({ text: `Užduotis ${slots.length + 1}`, weight: 10, color: colors[slots.length % colors.length] });
      renderSlotsUI();
    }

    function removeSlot(index) {
      if (slots.length <= 2) {
        alert("Ratas privalo turėti bent 2 sektorius!");
        return;
      }
      slots.splice(index, 1);
      renderSlotsUI();
    }

    function saveTemplate() {
      const name = document.getElementById('templateNameInput').value.trim();
      if (!name) { alert("Įveskite šablono pavadinimą!"); return; }
      const templates = JSON.parse(localStorage.getItem('wheelTemplates') || '{}');
      templates[name] = slots;
      localStorage.setItem('wheelTemplates', JSON.stringify(templates));
      document.getElementById('templateNameInput').value = '';
      updateTemplateDropdown();
      alert(`Šablonas "${name}" išsaugotas!`);
    }

    function updateTemplateDropdown() {
      const select = document.getElementById('templateSelect');
      select.innerHTML = '<option value="">-- Pasirinkite šabloną --</option>';
      const templates = JSON.parse(localStorage.getItem('wheelTemplates') || '{}');
      Object.keys(templates).forEach(name => {
        const opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        select.appendChild(opt);
      });
    }

    function loadTemplate() {
      const name = document.getElementById('templateSelect').value;
      if (!name) return;
      const templates = JSON.parse(localStorage.getItem('wheelTemplates') || '{}');
      if (templates[name]) {
        slots = JSON.parse(JSON.stringify(templates[name]));
        renderSlotsUI();
      }
    }

    function deleteTemplate() {
      const name = document.getElementById('templateSelect').value;
      if (!name) return;
      const templates = JSON.parse(localStorage.getItem('wheelTemplates') || '{}');
      delete templates[name];
      localStorage.setItem('wheelTemplates', JSON.stringify(templates));
      updateTemplateDropdown();
    }

    function addHistoryItem(name, prize) {
      const history = JSON.parse(localStorage.getItem('wheelHistory') || '[]');
      const dateStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      history.unshift({ name, prize, time: dateStr });
      localStorage.setItem('wheelHistory', JSON.stringify(history));
      renderHistoryUI();
    }

    function renderHistoryUI() {
      const history = JSON.parse(localStorage.getItem('wheelHistory') || '[]');
      const list = document.getElementById('historyList');
      list.innerHTML = '';
      history.forEach(item => {
        const li = document.createElement('li');
        li.className = 'history-item';
        li.innerHTML = `<span><span class="history-name">${item.name}</span>: ${item.prize}</span><span style="color:#94a3b8; font-size:0.8rem;">${item.time}</span>`;
        list.appendChild(li);
      });
    }

    function clearHistory() {
      localStorage.removeItem('wheelHistory');
      renderHistoryUI();
    }

    function showWinModal(name, text) {
      document.getElementById('winText').innerText = `${name} laimėjo: "${text}"!`;
      document.getElementById('winModal').classList.add('active');
    }

    function closeWinModal() {
      document.getElementById('winModal').classList.remove('active');
    }

    const confettiCanvas = document.getElementById('confettiCanvas');
    const confettiCtx = confettiCanvas.getContext('2d');
    let particles = [];

    function resizeConfetti() {
      confettiCanvas.width = window.innerWidth;
      confettiCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeConfetti);
    resizeConfetti();

    function triggerConfetti() {
      particles = [];
      const colors = ['#f59e0b', '#ef4444', '#a855f7', '#38bdf8', '#4ade80', '#fbbf24'];
      for (let i = 0; i < 90; i++) {
        particles.push({
          x: window.innerWidth / 2,
          y: window.innerHeight / 2,
          vx: (Math.random() - 0.5) * 14,
          vy: (Math.random() - 0.7) * 14,
          size: Math.random() * 8 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          life: 100
        });
      }
      animateConfetti();
    }

    function animateConfetti() {
      confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      particles.forEach((p, index) => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.25;
        p.life -= 1.5;
        confettiCtx.fillStyle = p.color;
        confettiCtx.fillRect(p.x, p.y, p.size, p.size);
        if (p.life <= 0) particles.splice(index, 1);
      });

      if (particles.length > 0) {
        requestAnimationFrame(animateConfetti);
      }
    }

    renderSlotsUI();
    updateTemplateDropdown();
    renderHistoryUI();
  </script>
</body>
</html>
